nameOverride: ""
fullnameOverride: ""

image:
  registry: registry.example.test
  tag: 0.2.3
  pullPolicy: Always

secret:
  create: false
  name: adsb-notifier-secrets
  data: {}

persistence:
  enabled: true
  keep: true
  existingClaim: ""
  storageClassName: ""
  accessModes:
    - ReadWriteOnce
  size: 1Gi

config:
  mountPath: /config
  fileName: config.json
  statusPath: /status/status.json
  backupRetention: 20

seedConfig:
  adsb_source:
    provider: adsb_lol
    query: point
    radius_miles: 40
  home:
    lat: 40.7608
    lon: -111.891
  poll_seconds: 30
  stale_aircraft_seconds: 90
  recent_matches_window_hours: 24
  source_error_alerts:
    enabled: true
    failure_threshold: 3
    cooldown_minutes: 60
  notifications:
    email:
      enabled: false
      html_enabled: true
      smtp_host: smtp.gmail.com
      smtp_port: 587
      starttls: true
      username: env:SMTP_USERNAME
      password: env:SMTP_PASSWORD
      from: env:SMTP_USERNAME
      to:
        - env:SMTP_USERNAME
      brand_theme: teal
      include_brand_images: true
      include_map_snapshot: false
      subject_template: "ADS-B alert: {aircraft_label} matched {rule_name}"
      body_template: "{message}\n\nAircraft: {aircraft_label}\nRegistration: {registration}\nFlight: {flight}\nType: {aircraft_type}\nDescription: {description}\nOperator: {operator}\nAltitude: {altitude_label}\nDistance: {distance_miles:.1f} mi\nTrack: {track_label}\nSpeed: {ground_speed_label}\nVertical rate: {vertical_rate_label}\nSquawk: {squawk}\nSeen: {seen_label}\nHex: {hex}\nAirplanes.live: {airplanes_live_url}\nRule: {rule_name}\nObserved: {observed_at}"
      html_body_template: |-
        <p>{message_html}</p>

        <p>
          <a href="{airplanes_live_url_html}">Airplanes.live</a>
        </p>

        {map_snapshot_html}

        <table>
          <tr>
            <th align="left">Aircraft</th>
            <td>{aircraft_label_html}</td>
          </tr>
          <tr>
            <th align="left">Registration</th>
            <td>{registration_html}</td>
          </tr>
          <tr>
            <th align="left">Flight</th>
            <td>{flight_html}</td>
          </tr>
          <tr>
            <th align="left">Type</th>
            <td>{aircraft_type_html}</td>
          </tr>
          <tr>
            <th align="left">Description</th>
            <td>{description_html}</td>
          </tr>
          <tr>
            <th align="left">Operator</th>
            <td>{operator_html}</td>
          </tr>
          <tr>
            <th align="left">Altitude</th>
            <td>{altitude_label_html}</td>
          </tr>
          <tr>
            <th align="left">Distance</th>
            <td>{distance_miles:.1f} mi</td>
          </tr>
          <tr>
            <th align="left">Track</th>
            <td>{track_label_html}</td>
          </tr>
          <tr>
            <th align="left">Speed</th>
            <td>{ground_speed_label_html}</td>
          </tr>
          <tr>
            <th align="left">Vertical rate</th>
            <td>{vertical_rate_label_html}</td>
          </tr>
          <tr>
            <th align="left">Squawk</th>
            <td>{squawk_html}</td>
          </tr>
          <tr>
            <th align="left">Seen</th>
            <td>{seen_label_html}</td>
          </tr>
          <tr>
            <th align="left">Hex</th>
            <td>{hex_html}</td>
          </tr>
          <tr>
            <th align="left">Rule</th>
            <td>{rule_name_html}</td>
          </tr>
          <tr>
            <th align="left">Observed</th>
            <td>{observed_at_html}</td>
          </tr>
        </table>
    twilio:
      enabled: false
      account_sid: env:TWILIO_ACCOUNT_SID
      api_key_sid: env:TWILIO_API_KEY_SID
      api_key_secret: env:TWILIO_API_KEY_SECRET
      from: env:TWILIO_FROM
      to: env:TWILIO_TO
      body_template: "{rule_name}: {aircraft_label} {distance_miles_1} mi away at {altitude_label}"
    pushover:
      enabled: false
      app_token: env:PUSHOVER_APP_TOKEN
      user_key: env:PUSHOVER_USER_KEY
      device: ""
      priority: 0
      sound: pushover
      title_template: "ADS-B: {aircraft_label}"
      url_template: "{airplanes_live_url}"
      url_title_template: "Airplanes.live"
      message_template: "{rule_name}: {aircraft_label} ({aircraft_type}) {distance_miles_1} mi away at {altitude_label}"
  rules:
    - name: Tail number near home
      event: tail
      tail_numbers:
        - N12345
      radius_miles: 25
      max_altitude_ft: 12000
      cooldown_minutes: 60

worker:
  replicaCount: 1
  image:
    repository: adsb-notifier-worker
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 256Mi

api:
  replicaCount: 1
  image:
    repository: adsb-notifier-api
  service:
    port: 8000
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 256Mi

ui:
  replicaCount: 1
  image:
    repository: adsb-notifier-ui
  service:
    type: ClusterIP
    port: 80
  containerPort: 8080
  resources:
    requests:
      cpu: 25m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 128Mi

ingress:
  enabled: false
  className: nginx
  annotations: {}
  hosts:
    - host: adsb-notifier.example.test
      paths:
        - path: /
          pathType: Prefix
  tls: []

initImage:
  repository: busybox
  tag: "1.36"
  pullPolicy: IfNotPresent
