apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "adsb-notifier.fullname" . }}-ui
  labels:
    {{- include "adsb-notifier.componentLabels" (dict "root" . "component" "ui") | nindent 4 }}
spec:
  replicas: {{ .Values.ui.replicaCount }}
  selector:
    matchLabels:
      {{- include "adsb-notifier.componentSelectorLabels" (dict "root" . "component" "ui") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "adsb-notifier.componentSelectorLabels" (dict "root" . "component" "ui") | nindent 8 }}
    spec:
      containers:
        - name: ui
          image: {{ include "adsb-notifier.image" (dict "root" . "repository" .Values.ui.image.repository) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.ui.containerPort }}
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          resources:
            {{- toYaml .Values.ui.resources | nindent 12 }}
