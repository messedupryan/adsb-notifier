apiVersion: v1
kind: Service
metadata:
  name: adsb-notifier-api
  labels:
    app.kubernetes.io/name: adsb-notifier
    app.kubernetes.io/component: api
spec:
  selector:
    app.kubernetes.io/name: adsb-notifier
    app.kubernetes.io/component: api
  ports:
    - name: http
      port: 8000
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: adsb-notifier-ui
  labels:
    app.kubernetes.io/name: adsb-notifier
    app.kubernetes.io/component: ui
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: adsb-notifier
    app.kubernetes.io/component: ui
  ports:
    - name: http
      port: 80
      targetPort: http
