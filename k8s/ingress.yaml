apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: adsb-notifier-ui
  namespace: adsb
  labels:
    app.kubernetes.io/name: adsb-notifier
    app.kubernetes.io/component: ui
spec:
  ingressClassName: nginx
  rules:
    - host: adsb-notifier.example.test
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: adsb-notifier-ui
                port:
                  number: 80
    - host: adsb-notifier-alt.example.test
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: adsb-notifier-ui
                port:
                  number: 80
