[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "adsb-notifier"
version = "0.2.6"
description = "Containerized ADS-B event monitor with configurable notifications."
requires-python = ">=3.11"
dependencies = ["Pillow>=12.3.0"]

[project.scripts]
adsb-notifier = "adsb_notifier.main:main"
adsb-notifier-api = "adsb_notifier.api:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["adsb_notifier*"]

[tool.setuptools.package-data]
adsb_notifier = ["assets/email/*.png"]
